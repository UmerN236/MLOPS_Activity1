name: Continuous Delivery

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.release.outputs.image }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          expected_version="$(tr -d '[:space:]' < VERSION)"

          if [[ "$version" != "$expected_version" ]]; then
            echo "Tag version $version does not match VERSION $expected_version" >&2
            exit 1
          fi

          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image once
        run: |
          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${{ steps.release.outputs.version }}" \
            -t "${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}" \
            -t "${{ steps.release.outputs.image }}:latest" \
            .

      - name: Publish Docker images
        run: |
          docker push "${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}"
          docker push "${{ steps.release.outputs.image }}:latest"

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - name: Deploy versioned image to staging
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          VERSION: ${{ needs.build.outputs.version }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: IMAGE,VERSION,GHCR_USER,GHCR_TOKEN
          script: |
            set -eu
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE:$VERSION"
            docker logout ghcr.io
            docker stop mlops-api || true
            docker rm mlops-api || true
            docker run -d \
              --name mlops-api \
              --restart unless-stopped \
              -p 5000:5000 \
              "$IMAGE:$VERSION"

      - name: Verify staging deployment
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          curl --fail --show-error \
            --retry 10 --retry-delay 3 --retry-all-errors \
            "http://${STAGING_HOST}:5000/health"

  deploy-production:
    needs:
      - build
      - deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Promote versioned image to production
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          VERSION: ${{ needs.build.outputs.version }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          envs: IMAGE,VERSION,GHCR_USER,GHCR_TOKEN
          script: |
            set -eu
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE:$VERSION"
            docker logout ghcr.io
            docker stop mlops-api || true
            docker rm mlops-api || true
            docker run -d \
              --name mlops-api \
              --restart unless-stopped \
              -p 5000:5000 \
              "$IMAGE:$VERSION"

      - name: Verify production deployment
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
        run: |
          curl --fail --show-error \
            --retry 10 --retry-delay 3 --retry-all-errors \
            "http://${PRODUCTION_HOST}:5000/health"
